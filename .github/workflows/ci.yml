name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - name: Build application and generate router types
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          BETTER_AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime
      - run: pnpm check
      - run: pnpm test
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-production.sh scripts/install-auto-deploy.sh
          shellcheck scripts/deploy-production.sh scripts/install-auto-deploy.sh
          python3 scripts/test-deploy-production.py
      - name: Build production image
        run: docker build --tag pokedata-ci --file apps/web/Dockerfile .
