packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^26.2.0
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  tailwindcss: ^4.3.3
  "@orpc/server": ^1.14.12
  "@orpc/client": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  better-auth: 1.7.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 4.1.11
  vite-plus: 0.3.2
minimumReleaseAgeExclude:
  - framer-motion@13.4.3
  - motion@13.4.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
